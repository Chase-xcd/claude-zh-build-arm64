name: build-arm64-zh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch localization tool
        run: |
          set -euo pipefail
          curl -fsSL -o repo.tar.gz https://codeload.github.com/taekchef/claude-code-zh-cn/tar.gz/refs/heads/main
          mkdir -p repo
          tar xzf repo.tar.gz -C repo --strip-components=1
          cd repo
          npm install --no-audit --no-fund node-lief@1.3.2

      - name: Fetch official arm64 binary
        run: |
          set -euo pipefail
          URL="https://pub-8aade9716740458c90010fb69ab3f3a3.r2.dev/ad3d95718fa4f74b5d398cb20d781841/bin/claude-native-2.1.308-darwin-arm64"
          curl -fsSL --retry 5 --retry-all-errors -o claude-arm64 "$URL"
          chmod +x claude-arm64
          file claude-arm64
          ACTUAL="$(shasum -a 256 claude-arm64 | awk '{print $1}')"
          EXPECTED="ca923c86ac84b30574a82331a05b6e066c27477a926ceaffe46a845a33e4dd37"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "official binary SHA mismatch: $ACTUAL"
            exit 1
          fi
          ./claude-arm64 --version

      - name: Patch bytecode
        run: |
          set -euo pipefail
          node repo/scripts/patch-bytecode.js patch claude-arm64 repo/cli-translations.json --json | tee result.json
          cat result.json

      - name: Verify patched binary
        run: |
          set -euo pipefail
          ./claude-arm64 --version
          ./claude-arm64 --help | head -8
          ./claude-arm64 --help | grep -q "用法" && echo "CHINESE_HELP_OK"
          codesign --verify --strict --verbose=2 claude-arm64
          shasum -a 256 claude-arm64 | tee sha256.txt
          ls -l claude-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: claude-arm64-zh
          path: |
            claude-arm64
            result.json
            sha256.txt
          if-no-files-found: error
